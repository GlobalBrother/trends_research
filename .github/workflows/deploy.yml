# =============================================================================
# GitHub Actions: Build and Deploy to Azure App Service
# Triggers on push to main branch or manual dispatch
# =============================================================================

name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "terraform/**"
  workflow_dispatch:

env:
  ACR_NAME: trendsresearchacr
  IMAGE_NAME: trends-research-app
  APP_NAME: trends-research-app
  RESOURCE_GROUP: trends-research-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"
          docker build -f Dockerfile.api \
            -t "${IMAGE_TAG}:${{ github.sha }}" \
            -t "${IMAGE_TAG}:latest" .
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Health check
        run: |
          echo "Waiting 30s for deployment to stabilize..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ env.APP_NAME }}.azurewebsites.net/health" || true)
          if [ "$STATUS" = "200" ]; then
            echo "Deployment successful — health check passed."
          else
            echo "Warning: health check returned $STATUS (app may still be starting)."
          fi

      - name: Azure logout
        run: az logout
        if: always()
